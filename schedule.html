<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розклад тренувань | Fitness Club</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f3;
            color: #222;
        }

        header {
            background: #183c32;
            color: white;
            text-align: center;
            padding: 25px;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        h2 {
            color: #245747;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #245747;
            color: white;
        }

        a {
            color: #245747;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Розклад тренувань</h1>
        <p>Fitness Club</p>
    </header>

    <main>
        <h2>Графік занять</h2>

        <table>
            <tr>
                <th>День</th>
                <th>Час</th>
                <th>Тип тренування</th>
            </tr>
            <tr>
                <td>Понеділок</td>
                <td>09:00</td>
                <td>Силове тренування</td>
            </tr>
            <tr>
                <td>Вівторок</td>
                <td>11:00</td>
                <td>Кардіотренування</td>
            </tr>
            <tr>
                <td>Середа</td>
                <td>17:00</td>
                <td>Функціональний тренінг</td>
            </tr>
            <tr>
                <td>Четвер</td>
                <td>10:00</td>
                <td>Йога</td>
            </tr>
            <tr>
                <td>П'ятниця</td>
                <td>18:00</td>
                <td>Силове тренування</td>
            </tr>
            <tr>
                <td>Субота</td>
                <td>12:00</td>
                <td>Групове тренування</td>
            </tr>
        </table>

        <p><a href="index.html">Повернутися на головну сторінку</a></p>
    </main>

</body>
</html>
